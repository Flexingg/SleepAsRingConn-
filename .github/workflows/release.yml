name: Build & Release APK

# Every build of main (a merge, or the auto-merge in pr-build.yml dispatching this workflow)
# becomes a GitHub Release with the APK attached, marked "Latest". Pushing a v* tag still makes
# a named release.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease -PciVersionCode=$((100000 + ${{ github.run_number }}))

      - name: Name APK
        id: meta
        run: |
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="Release ${GITHUB_REF_NAME}"
          else
            tag="build-${{ github.run_number }}"
            title="v${version} build ${{ github.run_number }}"
          fi
          apk="SleepAsRingConn-v${version}-build${{ github.run_number }}.apk"
          mv app/build/outputs/apk/release/*.apk "$apk"
          {
            echo "tag=$tag"
            echo "title=$title"
            echo "apk=$apk"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: ${{ steps.meta.outputs.apk }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          files: ${{ steps.meta.outputs.apk }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
